<title>MiniRue Storefront Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ink-900:#0B0B0B;--ink-800:#1A1815;--ink-700:#2E2A24;--ink-600:#3F3A32;--ink-500:#5C564C;--ink-400:#8A8376;--ink-300:#B5AE9F;
  --gold-900:#6B5526;--gold-700:#846432;--gold-500:#95783C;--gold-400:#B0924F;--gold-300:#C9B483;--gold-200:#E4D7B4;--gold-100:#EEE6D1;
  --cream-100:#FDFBF5;--cream-200:#F6F2E9;--cream-300:#EDE7D6;--cream-400:#DCD3BB;
  --bg:#F4F2EC;--surface:#FFFFFF;--sub:#F9F7F2;--hair:#E6E2D8;--row-hover:#F0EDE4;
  --ok-bg:#E5F1E6;--ok-fg:#2C5A38;--warn-bg:#FBEFCF;--warn-fg:#7A5212;--danger-bg:#FADDDE;--danger-fg:#8E1418;--muted-bg:#ECE8DE;--muted-fg:#5A5244;--info-bg:#E3EAF2;--info-fg:#2E466B;
  --fg:var(--ink-900);--fg2:var(--ink-700);--fg3:var(--ink-500);--fg4:#766F63;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Jost","Futura",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Didot",Georgia,serif;
  --r-sm:4px;--r-md:8px;--r-lg:14px;
  --sh-sm:0 2px 4px rgba(11,11,11,.05),0 4px 10px rgba(11,11,11,.06);
  --sh-lg:0 14px 28px rgba(11,11,11,.14),0 28px 56px rgba(11,11,11,.16);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --side:216px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;accent-color:var(--ink-900)}
::selection{background:var(--gold-100);color:var(--ink-900)}
*{scrollbar-width:thin;scrollbar-color:var(--cream-400) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--cream-400);border-radius:3px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
table{font-size:inherit;line-height:inherit;color:inherit;border-collapse:separate;border-spacing:0;width:100%}
:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ── Shell (same as Analytics A) ── */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{background:var(--ink-900);color:var(--cream-100);padding:18px 12px;position:sticky;top:0;height:100vh;display:none;flex-direction:column;gap:18px}
.brand{font:500 17px/1 var(--label);letter-spacing:.24em;padding:6px 10px 10px;color:var(--cream-100)}
.brand span{color:var(--gold-300)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:#C9C2B3;text-decoration:none;font-weight:500}
.side a:hover,.side a[aria-current="page"]{background:var(--ink-800);color:var(--cream-100)}
.side a[aria-current="page"] svg{color:var(--gold-300)}
.side .foot{margin-top:auto;font-size:12px;color:#9A9385;padding:0 10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink-900);color:var(--cream-100)}
.head{padding:20px 28px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font:600 22px/1.2 var(--ui);letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--fg3)}
/* Animate UI: Tabs + Highlight */
.tabs{position:relative;display:flex;gap:2px;padding:14px 28px 0;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:12px 12px 13px;color:var(--fg3);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0;display:inline-flex;align-items:center;gap:6px}
.tab:hover,.tab[aria-selected="true"]{color:var(--fg)}
.tab .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn-bg);color:var(--warn-fg);font-size:12px;font-weight:600}
.tab .count.bad{background:var(--danger-bg);color:var(--danger-fg)}
.tab-ind{position:absolute;bottom:-1px;left:0;height:2px;background:var(--ink-900);border-radius:2px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.tab-ind{transition:transform 240ms var(--ease),width 240ms var(--ease)}}
/* Publish bar (global, sticky) */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,242,236,.97);border-bottom:1px solid var(--hair);padding:10px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-spacer{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 11px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--cream-400);background:var(--cream-100)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink-900);border-color:var(--ink-900);color:var(--cream-100)}
.btn.primary:hover{background:var(--ink-700)}
.btn.danger{background:var(--danger-fg);border-color:var(--danger-fg);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--cream-300)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{height:28px;padding:0 9px}
.state-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;font-weight:600;white-space:nowrap}
.state-pill.draft{background:var(--warn-bg);color:var(--warn-fg)}
.state-pill.live{background:var(--ok-bg);color:var(--ok-fg)}
.state-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.spin svg{animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dq{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 28px 0;color:var(--fg3);font-size:12px}
.dq span{display:inline-flex;align-items:center;gap:6px}
.dq .ok{color:var(--ok-fg)}
.dq .warn{color:var(--warn-fg)}
.lg-toggle,.chk-toggle{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:2px 8px 2px 7px;color:var(--fg2);font-weight:500;font-size:12px}
.lg-toggle:hover,.chk-toggle:hover{border-color:var(--cream-400);color:var(--fg)}
.lg-toggle[aria-expanded="true"],.chk-toggle[aria-expanded="true"]{background:var(--cream-100);border-color:var(--gold-300);color:var(--fg)}
.chk-toggle.has{background:var(--warn-bg);border-color:#EED9A2;color:var(--warn-fg)}
.lg-toggle svg:last-child,.chk-toggle svg:last-child{width:12px;height:12px}
@media (prefers-reduced-motion:no-preference){.lg-toggle svg:last-child,.chk-toggle svg:last-child{transition:transform 180ms var(--ease)}}
.lg-toggle[aria-expanded="true"] svg:last-child,.chk-toggle[aria-expanded="true"] svg:last-child{transform:rotate(180deg)}
/* Animate UI: Auto Height */
.ah{display:grid;grid-template-rows:0fr}
.ah>div{overflow:hidden;min-height:0}
.ah.open{grid-template-rows:1fr}
@media (prefers-reduced-motion:no-preference){.ah{transition:grid-template-rows 220ms var(--ease)}}
.drawers{padding:0 28px}
.fold{margin-top:12px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px}
.fold-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.fold-head h2{margin:0;font:600 16px/1.3 var(--ui)}
/* Legend */
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 40px}
.lg-g h3{margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink-900);font:600 13px/1.3 var(--ui)}
.lg-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:1.5;color:var(--fg2)}
.lg-row:last-child{border-bottom:0}
.lg-k{display:flex;align-items:center;min-width:0}
/* Checks */
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--hair)}
.check:last-child{border-bottom:0}
.check .warn{color:var(--warn-fg)}
.check .bad{color:var(--danger-fg)}
.check .ok{color:var(--ok-fg)}
.check p{margin:2px 0 0;color:var(--fg3)}
/* Work area: editor + preview */
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:14px 16px 150px;align-items:start}
.editor{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (prefers-reduced-motion:no-preference){.editor.enter{animation:enter 220ms var(--ease)}}
@keyframes enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.panel-h h2{margin:0;font:600 14px/1.3 var(--ui)}
.panel-h .meta{display:block;color:var(--fg3);font-size:12px;margin-top:2px}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;align-items:flex-start;gap:10px;margin:0;padding:11px 14px;border-radius:var(--r-md);background:var(--gold-100);color:var(--ink-800);line-height:1.5}
.answer>svg{margin-top:2px;color:var(--gold-900)}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.55}
.pill svg{width:12px;height:12px}
.t-hero{background:#F3EBD9;color:#6B5526}
.t-collabShowcase{background:#E8E3F7;color:#46329E}
.t-ribbon{background:#DDF1EC;color:#00614F}
.t-productGrid{background:#DDEBF4;color:#0A5A82}
.t-journal{background:#F5E1EF;color:#7A2A69}
.k-category{background:#DDF1EC;color:#00614F}
.k-brand{background:#E8E3F7;color:#46329E}
.k-product{background:#DDEBF4;color:#0A5A82}
.k-collaborator{background:#F5E1EF;color:#7A2A69}
.k-link{background:#ECE8DE;color:#3F3A32}
.k-builtin{background:#0B0B0B;color:#FDFBF5}
.s-shown{background:var(--ok-bg);color:var(--ok-fg)}
.s-hidden{background:var(--muted-bg);color:var(--muted-fg)}
.s-warn{background:var(--warn-bg);color:var(--warn-fg)}
.s-bad{background:var(--danger-bg);color:var(--danger-fg)}
.c-cond{background:var(--info-bg);color:var(--info-fg)}
.c-always{background:var(--muted-bg);color:var(--muted-fg)}
.token{display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;background:var(--gold-100);color:var(--gold-900);font:600 12px/1.6 ui-monospace,"SF Mono",Menlo,monospace}
button.token{border:1px dashed var(--gold-300)}
button.token:hover{background:var(--gold-200)}
/* Section list (Home page) */
.slist{list-style:none;margin:0;padding:0}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--hair);background:var(--surface)}
.srow:last-child{border-bottom:0}
.srow.hidden-row .s-title,.srow.hidden-row .s-sum{opacity:.55}
.srow.selected{background:var(--cream-100);box-shadow:inset 0 0 0 1px var(--gold-300)}
.move{display:flex;flex-direction:column;gap:2px}
.move button{display:grid;place-items:center;width:26px;height:20px;border:1px solid var(--hair);background:var(--surface);border-radius:5px;color:var(--fg3);padding:0}
.move button:hover{color:var(--fg);border-color:var(--cream-400)}
.move button[disabled]{opacity:.35;cursor:not-allowed}
.move svg{width:13px;height:13px}
.s-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.s-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.s-sum{color:var(--fg3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-act{display:flex;align-items:center;gap:8px;grid-column:1/-1;justify-content:space-between}
/* Switch */
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:34px;height:20px;border-radius:10px;background:var(--cream-400);position:relative;flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(11,11,11,.2)}
@media (prefers-reduced-motion:no-preference){.sw .tr,.sw .tr::after{transition:all 180ms var(--ease)}}
.sw input:checked+.tr{background:var(--ink-900)}
.sw input:checked+.tr::after{transform:translateX(14px)}
.sw input:focus-visible+.tr{outline:2px solid var(--gold-400);outline-offset:2px}
.sw .lbl{font-size:12.5px;color:var(--fg2);min-width:44px}
.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.add-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border:1px dashed var(--cream-400);border-radius:var(--r-md);background:var(--sub);text-align:left}
.add-card:hover{border-style:solid;border-color:var(--gold-300);background:var(--cream-100)}
.add-card small{color:var(--fg3)}
/* Generic rows (nav items, perks, links, pages) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row .r-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .r-main small{color:var(--fg3)}
.row .r-main .err{color:var(--danger-fg);font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.row .r-main .wrn{color:var(--warn-fg);font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.icon-tile{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-md);background:var(--cream-200);color:var(--ink-700)}
/* Forms */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span:first-child{font:500 12px/1.3 var(--label);letter-spacing:.04em;color:var(--fg3)}
.field small{color:var(--fg3);font-size:12px}
.field .ferr{color:var(--danger-fg);font-size:12px}
.inp,select.inp,textarea.inp{width:100%;min-height:36px;border:1px solid var(--hair);border-radius:var(--r-md);padding:7px 10px;background:var(--surface);font:400 13px/1.45 var(--ui)}
textarea.inp{resize:vertical;min-height:84px}
.inp:focus{outline:2px solid var(--gold-400);outline-offset:1px}
.inp.bad{border-color:#E0A3A5;background:#FFF8F8}
.prefix{display:flex;align-items:stretch}
.prefix span{display:grid;place-items:center;padding:0 10px;border:1px solid var(--hair);border-right:0;border-radius:var(--r-md) 0 0 var(--r-md);background:var(--sub);color:var(--fg3);font-family:ui-monospace,Menlo,monospace}
.prefix .inp{border-radius:0 var(--r-md) var(--r-md) 0}
.chips-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-e{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--cream-200);border:1px solid var(--hair);font-weight:500}
.chip-e button{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:50%;background:none;color:var(--fg3)}
.chip-e button:hover{background:var(--cream-300);color:var(--fg)}
/* Animate UI: Toggle Group */
.tg{position:relative;display:inline-flex;padding:2px;background:var(--cream-300);border-radius:var(--r-md);align-self:flex-start}
.tg button{position:relative;z-index:1;border:0;background:none;height:28px;padding:0 10px;border-radius:6px;color:var(--fg3);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tg button[aria-pressed="true"]{color:var(--fg)}
.tg .hl{position:absolute;top:2px;bottom:2px;left:0;background:var(--surface);border-radius:6px;box-shadow:0 1px 2px rgba(11,11,11,.08)}
@media (prefers-reduced-motion:no-preference){.tg .hl{transition:transform 200ms var(--ease),width 200ms var(--ease)}}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:1px solid var(--hair);padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink-900);outline-offset:2px}
.img-pick{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--hair);border-radius:var(--r-md);background:var(--sub)}
.img-pick .thumb{width:72px;height:52px;border-radius:6px;flex:none}
.img-pick div{display:flex;flex-direction:column;gap:2px;min-width:0}
.img-pick small{color:var(--fg3)}
.slide-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slide-tabs button{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);font-weight:500}
.slide-tabs button[aria-pressed="true"]{background:var(--ink-900);border-color:var(--ink-900);color:var(--cream-100)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--danger-bg);color:var(--danger-fg)}
.confirm p{margin:0}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
/* ── Preview (mini storefront) ── */
.pv{position:sticky;top:64px;display:none;flex-direction:column;gap:10px}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pv-bar h2{margin:0;font:600 14px/1.3 var(--ui)}
.pv-bar small{color:var(--fg3)}
.pv-frame{background:var(--ink-800);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sh-sm)}
.pv-screen{background:#FBF8F1;border-radius:8px;overflow:hidden auto;max-height:calc(100vh - 190px);margin:0 auto;width:100%}
@media (prefers-reduced-motion:no-preference){.pv-screen{transition:width 260ms var(--ease)}}
.pv-screen.mobile{width:340px;max-width:100%}
.sf{font-size:11px;color:#1A1815;font-family:var(--ui)}
.sf .blk{position:relative;cursor:pointer}
.sf .blk:hover{outline:1px dashed var(--gold-400);outline-offset:-1px}
.sf .blk.on{outline:2px solid var(--gold-400);outline-offset:-2px}
.sf .blk .tagl{position:absolute;top:4px;left:4px;z-index:2;display:none}
.sf .blk.on .tagl,.sf .blk:hover .tagl{display:inline-flex}
.sf-ann{background:#0B0B0B;color:#FDFBF5;text-align:center;padding:5px 8px;font:500 10px/1.4 var(--label);letter-spacing:.14em;overflow:hidden;white-space:nowrap}
.sf-ann span{display:inline-block}
@media (prefers-reduced-motion:no-preference){.sf-ann span{animation:mq 14s linear infinite}}
@keyframes mq{from{transform:translateX(40%)}to{transform:translateX(-100%)}}
.sf-nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #E6E0D0;background:#FDFBF5}
.sf-logo{font:500 13px/1 var(--label);letter-spacing:.22em}
.sf-nav .items{display:flex;gap:10px;flex:1;overflow:hidden;white-space:nowrap}
.sf-nav .items span.unf{color:#B03A3E;text-decoration:underline wavy}
.sf-nav .ico{display:flex;gap:8px;color:#3F3A32}
.sf-nav .ico svg{width:13px;height:13px}
.sf-hero{min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:18px 16px;position:relative;overflow:hidden}
.sf-hero .ey{font:500 9px/1 var(--label);letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.sf-hero .hl{font:600 24px/1.02 var(--serif);max-width:80%}
.sf-hero .sb{font-size:11px;opacity:.85}

<script>
(() => {
/* ─────────── Sample content (from minirueshop.com, 23 Sep 2026) ─────────── */
const TYPES = {
  hero:{l:'Hero carousel',ic:'layers',d:'Big rotating banner at the top'},
  collabShowcase:{l:'Collaborator showcase',ic:'users',d:'Tabs of partner products'},
  ribbon:{l:'Scrolling ribbon',ic:'mega',d:'A moving line of short messages'},
  productGrid:{l:'Product section',ic:'grid',d:'A row of products or brands'},

};
const KIND = {category:'Category',brand:'Brand',product:'Product',collaborator:'Collaborator',link:'Link',builtin:'Built-in'};
const PRODUCTS = [
  {n:'Arencia Vitamin C Booster Shot',p:1139,c:'#F3C98B'},
  {n:'Arencia Retinal Booster Shot',p:1139,c:'#E7B7A3'},
  {n:'The Vita A Retinal Shot Tightening Booster',p:1329,c:'#D9C7E8'},

];
const FACTS = {deliveryDays:'2–4 days',freeGovernorates:'Cairo, Giza',sameDayGovernorates:'Cairo',codLimit:'EGP 5,000',fee:'EGP 60',returnsDays:null};
const PERK_ICONS = ['truck','clock','cash','returns','pkg','star','shield','sparkle','support','gift','check','heart','grid'];
const SHOW_WHEN = {always:'Always',freeShipping:'Where delivery is free',sameDay:'Where same-day is offered',cod:'Where cash on delivery applies',returns:'When a returns window is set',reviews:'When the product has reviews'};
const MENU_ICONS = ['home','search','user','bag','heart','grid','gift','truck','check'];

const INITIAL = () => ({
  sections:[
    {id:'hero1',type:'hero',enabled:true,autoplayMs:6000,slides:[
      {id:'sl1',eyebrow:"S/S '26",headline:'NEW BUNDLES COMING SOON',sub:'Original and high copy perfumes',mode:'image',image:'bundles-hero.jpg',imageAlt:'',ctaLabel:'Shop now',cta:{kind:'category',label:'Cosmetics & Perfumes'},bg:'#0B0B0B',fg:'#FDFBF5',bottle:'#B0924F'},
      {id:'sl2',eyebrow:'Skincare',headline:'Booster shots, back in stock',sub:'Arencia and Celimax serums',mode:'editorial',image:'booster-shots.jpg',imageAlt:'Arencia booster shots on a vanity',ctaLabel:'Shop skincare',cta:{kind:'category',label:'Skincare'},bg:'#EEE6D1',fg:'#1A1815',bottle:'#E9A93A'}]},
    {id:'rib1',type:'ribbon',enabled:true,items:['Shipping all over Egypt',"New S/S '26",'Luxury packaging'],speedSeconds:24,surface:'ink'},
    {id:'grid1',type:'productGrid',enabled:true,eyebrow:"S/S '26",title:'New arrivals',display:'products',source:{kind:'manual',label:'4 products picked'},limit:4,viewAll:'/shop'},
    {id:'jr1',type:'journal',enabled:true,mode:'editorial',eyebrow:'Editorial N°4',title:'A Journey Through Mini Rue',body:'A curated edit of accessible luxury: the scents and serums we reach for, and why.',imageSide:'right',ctaLabel:'Read the edit',ctaHref:'/journal',badge:''},
    {id:'col1',type:'collabShowcase',enabled:false,eyebrow:'Partners',title:'From our collaborators',tabs:[{label:'Helia',limit:4}]},
  ],
  navbar:{showSearch:true,showAccount:true,items:[
    {id:'n1',kind:'category',label:'Cosmetics & Perfumes',target:'Cosmetics & Perfumes',featured:3},
    {id:'n2',kind:'link',label:'Shop',target:'/shop'},
    {id:'n3',kind:'brand',label:'Arencia',target:'Arencia'},
    {id:'n4',kind:'category',label:'New in',target:''},
  ]},
  mobileMenu:{shortcuts:[
    {id:'m1',label:'Home',icon:'home',kind:'builtin',target:'Home'},
    {id:'m2',label:'Search',icon:'search',kind:'builtin',target:'Search'},
    {id:'m3',label:'Shop all',icon:'grid',kind:'link',target:'/shop'},
    {id:'m4',label:'Skincare',icon:'heart',kind:'category',target:'Skincare'},
    {id:'m5',label:'Haircare',icon:'gift',kind:'category',target:'Haircare'},
    {id:'m6',label:'Account',icon:'user',kind:'builtin',target:'Account'},
  ],footerButton:{label:'Track my order',icon:'truck',kind:'link',target:'/orders'}},
  footer:{tagline:'Cosmetics & perfumes, delivered across Egypt.',newsletter:true,nlEyebrow:'Stay in the loop',nlBlurb:'New arrivals and restocks, once a week.',
    columns:[{id:'c1',title:'Shop',links:['Skincare','Haircare','Perfumes','All products']},{id:'c2',title:'Help',links:['Track order','Shipping','Returns','Contact']},{id:'c3',title:'About',links:['About MiniRue','Terms of Service','Privacy Policy']}],
    socials:['instagram','tiktok','facebook'],payments:['visa','mastercard','instapay'],legal:'© 2026 MiniRue. All rights reserved.',secondary:'Powered by Ebneely'},
  announcement:{enabled:true,messages:['WELCOME TO MINIRUE!!!','NEW HAIRCARE PRODUCTS.'],link:{kind:'category',label:'Haircare'},favicon:'https://minirueshop.com/favicon.ico'},
  perks:[
    {id:'p1',icon:'truck',text:'Delivered in {deliveryDays}',showWhen:'always',enabled:true},
    {id:'p2',icon:'truck',text:'Free delivery to {freeGovernorates}',showWhen:'freeShipping',enabled:true},
    {id:'p3',icon:'clock',text:'Same-day delivery in {sameDayGovernorates}',showWhen:'sameDay',enabled:true},
    {id:'p4',icon:'cash',text:'Cash on delivery for orders under {codLimit}',showWhen:'cod',enabled:true},
    {id:'p5',icon:'returns',text:'{returnsDays}-day returns',showWhen:'returns',enabled:true},
    {id:'p6',icon:'sparkle',text:'Luxury gift packaging on every order',showWhen:'always',enabled:true},
  ],
  pages:[
    {id:'pg1',title:'About MiniRue',slug:'about',enabled:true,edited:'12 Sep, 4:12 PM',body:'# About MiniRue\n\nMiniRue brings original cosmetics and perfumes to every governorate in Egypt.'},
    {id:'pg2',title:'Contact',slug:'contact',enabled:true,edited:'12 Sep, 4:14 PM',body:'# Contact\n\nWhatsApp: [your WhatsApp number]\nHours: Sun–Thu, 10:00 AM–6:00 PM Cairo time'},
    {id:'pg3',title:'Shipping',slug:'shipping',enabled:true,edited:'12 Sep, 4:20 PM',body:'# Shipping\n\nWe deliver in {deliveryDays}. Delivery is free to {freeGovernorates}.'},
    {id:'pg4',title:'Returns',slug:'returns',enabled:true,edited:'12 Sep, 4:21 PM',body:'# Returns\n\nYou can return unopened items within {returnsDays} days.'},
    {id:'pg5',title:'Terms of Service',slug:'terms',enabled:false,edited:'9 Sep, 11:05 AM',body:'# Terms of Service\n\nThis is a drafting scaffold, not legal advice.\n\nCompany: [registered company name]\nRegistration no.: [number]'},
    {id:'pg6',title:'Privacy Policy',slug:'privacy',enabled:false,edited:'9 Sep, 11:06 AM',body:'# Privacy Policy\n\nThis is a drafting scaffold, not legal advice.\n\nContact for data requests: [email]'},
    {id:'pg7',title:'Shop guide',slug:'shop',enabled:true,edited:'22 Sep, 7:40 PM',body:'# Shop guide\n\nHow to pick your first serum.'},
  ],
  trust:{returnsWindowDays:null,whatsapp:'',supportHours:'Sun–Thu, 10:00 AM–6:00 PM Cairo time'},
});
const RESERVED = ['account','brands','cart','categories','checkout','login','logout','shop','orders','pages','products','search','signup','forgot','reset-password','api'];

/* ─────────── State ─────────── */
let D = INITIAL();
let PUBLISHED = JSON.stringify(D);
const S = {tab:'home',device:'desktop',sel:null,demo:'live',legend:false,checks:false,slide:{},page:'pg4',lastPub:'20 Sep 2026, 4:12 PM'};
try{S.legend=localStorage.getItem('mr-sf-legend')==='1';}catch(_){}
const TABS = [
  {id:'home',l:'Home page'},{id:'navbar',l:'Navbar'},{id:'mobile',l:'Mobile menu'},{id:'footer',l:'Footer'},
  {id:'announcement',l:'Announcement'},{id:'product',l:'Product page'},{id:'pages',l:'Pages'},{id:'trust',l:'Trust & contact'},
];
const $ = s => document.querySelector(s);
const icon = (id,cls='i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const egp = n => 'EGP ' + n.toLocaleString('en-US');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const dirty = () => JSON.stringify(D)!==PUBLISHED;
function changeCount(){
  const a=JSON.parse(PUBLISHED); let n=0;
  ['sections','navbar','mobileMenu','footer','announcement','perks','pages','trust'].forEach(k=>{ if(JSON.stringify(a[k])!==JSON.stringify(D[k])) n++; });
  return n;
}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v;}

/* ─────────── Checks (run live, shown before publishing) ─────────── */
function checks(){
  const out=[];
  D.navbar.items.forEach(n=>{ if(!n.target||!n.label) out.push({tab:'navbar',sev:'warn',t:`Menu item “${n.label||'Untitled'}” has no page picked`,d:'Unfinished items are left out when you publish.',fix:'Pick a page'}); });
  D.sections.forEach(s=>{ if(s.type==='hero') s.slides.forEach((sl,i)=>{ if(!sl.imageAlt) out.push({tab:'home',sev:'warn',t:`Hero slide ${i+1} image has no description`,d:'Screen readers and Google read this. One short sentence is enough.',fix:'Add description',sec:s.id,slide:i}); }); });
  D.pages.forEach(p=>{
    const r=pageIssues(p,D.pages);
    if(r.bad) out.push({tab:'pages',sev:'bad',t:`Page “${p.title}”: ${r.bad}`,d:'This page can’t be published until it’s fixed.',fix:'Fix page',page:p.id});
    else if(p.enabled&&/\[[^\]]+\]/.test(p.body)) out.push({tab:'pages',sev:'warn',t:`Page “${p.title}” still has [placeholders]`,d:'Shoppers would see the brackets. Fill them in or hide the page.',fix:'Fill in',page:p.id});
  });
  if(D.trust.returnsWindowDays==null){
    const uses=D.pages.filter(p=>p.enabled&&p.body.includes('{returnsDays}')).map(p=>p.title);
    out.push({tab:'trust',sev:'warn',t:'No returns window set',d:`The “{returnsDays}-day returns” promise stays hidden${uses.length?`, and ${uses.join(', ')} shows an empty number`:''}.`,fix:'Set returns window'});
  }
  if(!D.trust.whatsapp) out.push({tab:'trust',sev:'info',t:'No WhatsApp number',d:'The Contact page and product pages can’t show a chat link.',fix:'Add number'});
  return out;
}
function pageIssues(p,all){
  const s=p.slug.trim();
  if(!p.title.trim()) return {bad:'title is empty'};
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s)) return {bad:'address may only use lowercase letters, numbers and hyphens'};
  if(RESERVED.includes(s)) return {bad:`/${s} is a built-in shop address, so this page could never be reached`};
  if(all.filter(x=>x.slug.trim()===s).length>1) return {bad:`/${s} is used by another page`};
  return {};
}
function tabCounts(){const c={};checks().forEach(x=>{if(x.sev==='info')return;c[x.tab]=c[x.tab]||{n:0,bad:false};c[x.tab].n++;if(x.sev==='bad')c[x.tab].bad=true;});return c;}

/* ─────────── Shell ─────────── */
function renderTabs(){
  const c=tabCounts();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${t.l}${c[t.id]?`<span class="count${c[t.id].bad?' bad':''}" aria-label="${c[t.id].n} to check">${c[t.id].n}</span>`:''}</button>`).join('')+'<span class="tab-ind" id="tab-ind"></span>';
  moveInd();
}
function moveInd(){const a=document.querySelector('.tab[aria-selected="true"]'),ind=$('#tab-ind');if(!a||!ind)return;ind.style.width=(a.offsetWidth-16)+'px';ind.style.transform=`translateX(${a.offsetLeft+8}px)`;}
function renderState(){
  const d=dirty(), n=changeCount();
  $('#state-pill').className='state-pill '+(d?'draft':'live');
  $('#state-pill').innerHTML=`<span class="dot"></span>${d?`${n} area${n>1?'s':''} changed · not live yet`:'Live · all changes published'}`;
  $('#state-note').textContent=d?'Shoppers still see the last published version.':`Last published ${S.lastPub}`;
  $('#b-discard').disabled=!d; $('#b-publish').disabled=!d; $('#m-publish').disabled=!d;
  const cs=checks(), blocking=cs.filter(x=>x.sev==='bad').length, warn=cs.filter(x=>x.sev==='warn').length;
  $('#dq').innerHTML=`<span>Updated after publish in about 1 minute (the shop caches for 60 seconds)</span>
    <button class="chk-toggle${blocking+warn?' has':''}" data-checks aria-expanded="${S.checks}" aria-controls="chk-main">${icon(blocking?'ban':warn?'alert':'ok','i sm')}${blocking?`${blocking} must fix`:''}${blocking&&warn?' · ':''}${warn?`${warn} to check`:''}${!blocking&&!warn?'All checks pass':''}${icon('down','i sm')}</button>
    <button class="lg-toggle" data-legend aria-expanded="${S.legend}" aria-controls="lg-main">${icon('info','i sm')}Legend${icon('down','i sm')}</button>`;
  renderChecks();
}
function renderDrawers(){
  $('#drawers').innerHTML=`<div class="ah${S.checks?' open':''}" id="chk-main"><div><div class="fold"><div class="fold-head"><h2>Before you publish</h2><button class="icon-btn" data-checks aria-label="Collapse checks">${icon('x')}</button></div><div class="checks" id="chk-list"></div></div></div></div>
  <div class="ah${S.legend?' open':''}" id="lg-main"><div><div class="fold"><div class="fold-head"><h2>Legend</h2><button class="icon-btn" data-legend aria-label="Collapse legend">${icon('x')}</button></div>${legendHTML()}</div></div></div>`;
  renderChecks();
}
function renderChecks(){
  const el=$('#chk-list'); if(!el) return;
  const cs=checks();
  el.innerHTML=cs.length?cs.map((x,i)=>`<div class="check"><span class="${x.sev==='bad'?'bad':x.sev==='warn'?'warn':'ok'}">${icon(x.sev==='bad'?'ban':x.sev==='warn'?'alert':'info')}</span><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p></div><button class="btn sm" data-fix="${i}">${x.fix}${icon('arrow','i sm')}</button></div>`).join('')
    :`<div class="check"><span class="ok">${icon('ok')}</span><div><b>Everything checks out</b><p>Nothing unfinished, no broken addresses, no placeholders showing.</p></div><span></span></div>`;
}
function legendHTML(){
  const row=(k,t)=>`<div class="lg-row"><span class="lg-k">${k}</span><span>${t}</span></div>`;
  const g=(h,rows)=>`<section class="lg-g" aria-label="${h}"><h3>${h}</h3>${rows}</section>`;
  return `<div class="lg-grid">
    ${g('Home page sections',Object.keys(TYPES).map(k=>row(`<span class="pill t-${k}">${icon(TYPES[k].ic,'i sm')}${TYPES[k].l}</span>`,TYPES[k].d)).join(''))}
    ${g('Where a link goes',[['category','A category page, e.g. Skincare'],['brand','All products of one brand'],['product','One product page'],['collaborator','A partner’s shop space'],['link','Any address you type, e.g. /shop'],['builtin','Built into the shop: Home, Search, Cart, Account']].map(([k,t])=>row(`<span class="pill k-${k}">${KIND[k]}</span>`,t)).join(''))}
    ${g('Status',[[`<span class="pill s-shown">${icon('eye','i sm')}Shown</span>`,'Visible on the live shop after you publish'],[`<span class="pill s-hidden">Hidden</span>`,'Kept with its settings, not shown to shoppers'],[`<span class="pill s-warn">${icon('alert','i sm')}Unfinished</span>`,'Missing something. Left out or shown oddly until fixed'],[`<span class="pill s-bad">${icon('ban','i sm')}Can’t publish</span>`,'Blocks publishing until fixed, e.g. a clashing page address'],[`<span class="state-pill draft" style="height:24px;font-size:12px"><span class="dot"></span>Not live yet</span>`,'You have changes shoppers can’t see until you publish']].map(([a,b])=>row(a,b)).join(''))}
    ${g('Product page promises',[[`<span class="pill c-always">Always</span>`,'Printed exactly as written, on every product'],[`<span class="pill c-cond">${icon('info','i sm')}Where delivery is free</span>`,'Shown only when the shop’s live settings make it true'],[`<span class="token">{deliveryDays}</span>`,'Filled in from Settings when the page loads. Never typed by hand.'],[`<span class="pill s-shown">Showing now</span>`,'True today with your current settings'],[`<span class="pill s-hidden">Not showing</span>`,'Its condition isn’t true right now, so shoppers don’t see it']].map(([a,b])=>row(a,b)).join(''))}
  </div>`;
}

/* ─────────── Editors (left) ─────────── */
function sectionSummary(s){
  switch(s.type){
    case 'hero': return `${s.slides.length} slide${s.slides.length>1?'s':''} · changes every ${s.autoplayMs/1000}s · “${s.slides[0].headline}”`;
    case 'ribbon': return `${s.items.length} messages · ${s.surface==='ink'?'black':'cream'} background · ${s.items.join(' · ')}`;

function perkShows(p){

    case 'always': return [true,'Always'];

    case 'cod': return [true,`Orders under ${FACTS.codLimit}`];
    case 'returns': return [D.trust.returnsWindowDays!=null,D.trust.returnsWindowDays!=null?`${D.trust.returnsWindowDays} days set`:'No returns window set'];
    case 'reviews': return [true,'Products with reviews'];
  }
}

/* FLIP: sections glide to their new place (Animate UI-style layout animation) */
function flip(sel,mutate){
  const before=new Map([...document.querySelectorAll(sel)].map(el=>[el.dataset.sid||el.dataset.nid,el.getBoundingClientRect().top]));
  mutate();
  if(reduce.matches) return;
  document.querySelectorAll(sel).forEach(el=>{const k=el.dataset.sid||el.dataset.nid;const b=before.get(k);if(b==null)return;const d=b-el.getBoundingClientRect().top;if(!d)return;
    el.style.transition='none';el.style.transform=`translateY(${d}px)`;requestAnimationFrame(()=>{el.style.transition='';el.style.transform='';});});
}

function toast(msg,undo){

  $('#toasts').appendChild(el); setTimeout(()=>el.remove(),undo?6000:3600);
}

function openSheet(title,sub,body,foot,trig){

  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-labelledby','sh-t');
  sh.innerHTML=`<div class="sheet-h"><div><h2 id="sh-t">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}`;
  document.body.append(scrim,sh); SH={scrim,sh,trig};
  scrim.onclick=()=>closeSheet();
  sh.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});
  sh.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();closeSheet();}
    if(e.key==='Tab'){const f=[...sh.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')].filter(x=>x.offsetParent!==null);const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
  });
  document.body.style.overflow='hidden';
  setTimeout(()=>{(sh.querySelector('[data-autofocus]')||sh.querySelector('.sheet-b input,.sheet-b select,.sheet-b button')||sh.querySelector('[data-close]')).focus();setTG();},30);
  return sh;
}

  if(blocking.length){S.checks=true;renderDrawers();renderState();toast(`${blocking.length} thing${blocking.length>1?'s':''} must be fixed before publishing`);$('#chk-main').scrollIntoView({behavior:reduce.matches?'auto':'smooth',block:'start'});return;}
  const n=changeCount(), unf=D.navbar.items.filter(x=>!x.target).length;
  const sh=openSheet('Publish to minirueshop.com',`${n} area${n>1?'s':''} changed`,`<div class="checks">${TABS.filter(t=>{const a=JSON.parse(PUBLISHED);const map={home:'sections',navbar:'navbar',mobile:'mobileMenu',footer:'footer',announcement:'announcement',product:'perks',pages:'pages',trust:'trust'};return JSON.stringify(a[map[t.id]])!==JSON.stringify(D[map[t.id]]);}).map(t=>`<div class="check"><span class="ok">${icon('edit')}</span><div><b>${t.l}</b></div><span></span></div>`).join('')}</div>
    ${unf?`<div class="confirm" style="background:var(--warn-bg);color:var(--warn-fg)"><p>${unf} unfinished menu item${unf>1?'s':''} will be left out.</p></div>`:''}
    <p style="margin:0;color:var(--fg3)">Shoppers see the new version within about a minute.</p><div id="pub-st" role="status" aria-live="polite"></div>`,
    `<div class="r"><button class="btn" data-close>Not yet</button><button class="btn primary" id="pub-go" data-autofocus>${icon('check','i sm')}Publish now</button></div>`,btn);
  sh.querySelector('#pub-go').addEventListener('click',e=>{
    const go=e.currentTarget; go.disabled=true; const st=$('#pub-st');
    st.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><span>Publishing…</span><div class="progress"><i></i></div></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{st.querySelector('.progress i').style.transform='scaleX(1)';}));
    setTimeout(()=>{
      if(S.demo==='saveerror'){st.innerHTML=`<div class="confirm" role="alert"><p><b>Couldn’t publish.</b> The server refused the change (1:49 PM Cairo time). Nothing on the live shop changed. Your edits are still here.</p><div><button class="btn" id="pub-retry">Try again</button></div></div>`;go.disabled=false;sh.querySelector('#pub-retry').onclick=()=>{S.demo='live';setDemo();go.click();};return;}
      D.navbar.items=D.navbar.items.filter(x=>x.target);
      PUBLISHED=JSON.stringify(D); S.lastPub='23 Sep 2026, 1:48 PM'; closeSheet(); renderAll(false); toast('Published · live in about a minute');
    },reduce.matches?200:1300);
  });
}

/* ─────────── Events ─────────── */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind){setPath(D,el.dataset.bind,el.value);afterEdit(el);}
  if(el.dataset.bindn){const v=el.value===''?null:Number(el.value);setPath(D,el.dataset.bindn,v);afterEdit(el);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bindc){setPath(D,el.dataset.bindc,el.checked);renderAll(false);focusBack(el);}
  if(el.dataset.toggleSec){const s=D.sections.find(x=>x.id===el.dataset.toggleSec);s.enabled=el.checked;renderAll(false);focusBack(el);toast(el.checked?'Section shown':'Section hidden');}
  if(el.hasAttribute('data-toggle-fbtn')){D.mobileMenu.footerButton=el.checked?{label:'Track my order',icon:'truck',kind:'link',target:'/orders'}:null;renderAll(false);focusBack(el);}
  if(el.dataset.social){const a=D.footer.socials;D.footer.socials=el.checked?[...a,el.dataset.social]:a.filter(x=>x!==el.dataset.social);softRender();}
  if(el.dataset.pay){const a=D.footer.payments;D.footer.payments=el.checked?[...a,el.dataset.pay]:a.filter(x=>x!==el.dataset.pay);softRender();}
  if(el.tagName==='SELECT'&&(el.dataset.bind||el.dataset.bindn)){ if(SH&&$('#sec-form')){const s=D.sections.find(x=>x.id===S.sel);refreshSectionForm(s);} else {renderAll(false);focusBack(el);} }
});
function focusBack(el){const sel=el.id?'#'+el.id:el.dataset.bindc?`[data-bindc="${el.dataset.bindc}"]`:el.dataset.toggleSec?`[data-toggle-sec="${el.dataset.toggleSec}"]`:el.dataset.bind?`[data-bind="${el.dataset.bind}"]`:null;if(sel){const n=document.querySelector(sel);n&&n.focus();}}
function afterEdit(el){
  if(el.closest('.sheet')){ softRender(); if(el.closest('#sec-form')){const s=D.sections.find(x=>x.id===S.sel); const lbl=el.closest('.field'); if(el.dataset.bind&&el.dataset.bind.endsWith('imageAlt')){el.classList.toggle('bad',!el.value);const f=lbl.querySelector('.ferr');if(el.value&&f)f.remove();}} return; }
  softRender();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-pv]'); if(!t) return;
  if(t.dataset.tab){go(t.dataset.tab);return;}
  if(t.dataset.pv){const k=t.dataset.pv; if(TABS.some(x=>x.id===k)){go(k);} else if(k==='product'||k==='trust'){go(k);} else {if(S.tab!=='home')go('home'); openSection(k,null);} return;}
  if(t.dataset.edit){openSection(t.dataset.edit,t);return;}
  if(t.dataset.move){const [i,d]=t.dataset.move.split(':').map(Number);flip('.srow',()=>{const L=D.sections;[L[i],L[i+d]]=[L[i+d],L[i]];L.forEach((s,j)=>s.order=j);renderAll(false);});const b=document.querySelector(`[data-move="${i+d}:${d}"]`)||document.querySelector(`[data-move="${i+d}:${-d}"]`);b&&b.focus();return;}
  if(t.dataset.nmove){const [i,d]=t.dataset.nmove.split(':').map(Number);flip('.row[data-nid]',()=>{const L=D.navbar.items;[L[i],L[i+d]]=[L[i+d],L[i]];renderAll(false);});return;}
  if(t.dataset.add){const k=t.dataset.add;const id=k+Date.now();const base={id,type:k,enabled:false};
    const n={hero:{...base,autoplayMs:6000,slides:[{id:'s'+id,eyebrow:'',headline:'New headline',sub:'',mode:'image',image:'Choose a picture',imageAlt:'',ctaLabel:'Shop now',cta:{kind:'category',label:''},bg:'#0B0B0B',fg:'#FDFBF5',bottle:'#B0924F'}]},ribbon:{...base,items:['New message'],speedSeconds:24,surface:'ink'},productGrid:{...base,eyebrow:'',title:'New section',display:'products',source:{kind:'manual',label:'Pick products'},limit:4,viewAll:'/shop'},journal:{...base,mode:'editorial',eyebrow:'',title:'New story',body:'',imageSide:'right',ctaLabel:'',ctaHref:'',badge:''},collabShowcase:{...base,eyebrow:'',title:'From our collaborators',tabs:[{label:'Helia',limit:4}]}}[k];
    D.sections.push(n);renderAll(false);openSection(id,null);toast(`${TYPES[k].l} added (hidden until you switch it on)`);return;}
  if(t.dataset.slide){const [sid,j]=t.dataset.slide.split(':');S.slide[sid]=+j;refreshSectionForm(D.sections.find(x=>x.id===sid),`[data-slide="${sid}:${j}"]`);renderPreview();return;}
  if(t.dataset.addSlide){const s=D.sections.find(x=>x.id===t.dataset.addSlide);s.slides.push({...JSON.parse(JSON.stringify(s.slides[0])),id:'sl'+Date.now(),headline:'New slide',imageAlt:''});S.slide[s.id]=s.slides.length-1;refreshSectionForm(s);softRender();return;}
  if(t.dataset.set){setPath(D,t.dataset.set,t.dataset.val);const s=D.sections.find(x=>x.id===S.sel);if(s)refreshSectionForm(s,`[data-set="${t.dataset.set}"][data-val="${t.dataset.val}"]`);softRender();return;}
  if(t.dataset.swatch){const [p,b,f]=t.dataset.swatch.split(':');const sl=getPath(D,p);sl.bg=b;sl.fg=f;const s=D.sections.find(x=>x.id===S.sel);refreshSectionForm(s,`[data-swatch="${t.dataset.swatch}"]`);softRender();return;}
  if(t.dataset.delRib){const [i,j]=t.dataset.delRib.split(':').map(Number);D.sections[i].items.splice(j,1);refreshSectionForm(D.sections[i],'#rib-new');softRender();return;}
  if(t.dataset.addRib){const i=+t.dataset.addRib;const v=$('#rib-new').value.trim();if(!v){$('#rib-new').focus();return;}D.sections[i].items.push(v);refreshSectionForm(D.sections[i],'#rib-new');softRender();return;}
  if(t.dataset.pick){if(S.sel&&SH)reopenSection=S.sel;openPicker(t.dataset.pick,t);return;}
  if(t.dataset.pickSrc){toast('Product picker opens here (same as today)');return;}
  if(t.hasAttribute('data-add-nav')){D.navbar.items.push({id:'n'+Date.now(),kind:'category',label:'Untitled',target:''});renderAll(false);const last=D.navbar.items.at(-1);$('#nl-'+last.id).focus();return;}
  if(t.dataset.delNav){const i=+t.dataset.delNav;const it=D.navbar.items.splice(i,1)[0];renderAll(false);toast(`Removed “${esc(it.label)}”`,()=>{D.navbar.items.splice(i,0,it);renderAll(false);});return;}
  if(t.hasAttribute('data-add-short')){D.mobileMenu.shortcuts.push({id:'m'+Date.now(),label:'New',icon:'grid',kind:'link',target:'/shop'});renderAll(false);$('#ml-'+D.mobileMenu.shortcuts.at(-1).id).focus();return;}
  if(t.dataset.delShort){const i=+t.dataset.delShort;const it=D.mobileMenu.shortcuts.splice(i,1)[0];renderAll(false);toast(`Removed “${esc(it.label)}”`,()=>{D.mobileMenu.shortcuts.splice(i,0,it);renderAll(false);});return;}
  if(t.hasAttribute('data-add-col')){D.footer.columns.push({id:'c'+Date.now(),title:'New column',links:[]});renderAll(false);$('#fc-'+D.footer.columns.at(-1).id).focus();return;}
  if(t.dataset.delCol){const i=+t.dataset.delCol;const it=D.footer.columns.splice(i,1)[0];renderAll(false);toast(`Removed column “${esc(it.title)}”`,()=>{D.footer.columns.splice(i,0,it);renderAll(false);});return;}
  if(t.dataset.addLink){const i=+t.dataset.addLink;D.footer.columns[i].links.push(['Shipping','Returns','FAQ','Gift cards'][D.footer.columns[i].links.length%4]);renderAll(false);return;}
  if(t.dataset.delLink){const [i,j]=t.dataset.delLink.split(':').map(Number);D.footer.columns[i].links.splice(j,1);renderAll(false);return;}
  if(t.hasAttribute('data-add-msg')){D.announcement.messages.push('');renderAll(false);$('#am-'+(D.announcement.messages.length-1)).focus();return;}
  if(t.dataset.delMsg){D.announcement.messages.splice(+t.dataset.delMsg,1);renderAll(false);return;}
  if(t.hasAttribute('data-add-perk')){D.perks.push({id:'p'+Date.now(),icon:'sparkle',text:'',showWhen:'always',enabled:true});renderAll(false);$('#pk-'+D.perks.at(-1).id).focus();return;}
  if(t.dataset.page){S.page=t.dataset.page;renderAll(false);return;}
  if(t.dataset.editPage){openPage(t.dataset.editPage,t);return;}
  if(t.hasAttribute('data-add-page')){const id='pg'+Date.now();D.pages.push({id,title:'New page',slug:'new-page',enabled:false,edited:'just now',body:'# New page\n\n'});openPage(id,t);return;}
  if(t.hasAttribute('data-trust-pages')){const have=D.pages.map(p=>p.slug);const want=[['FAQ','faq'],['Imprint / legal','imprint']].filter(([,s])=>!have.includes(s));
    if(!want.length){toast('You already have all of them. Nothing changed');return;}
    want.forEach(([t2,s])=>D.pages.push({id:'pg'+s,title:t2,slug:s,enabled:false,edited:'just now',body:`# ${t2}\n\n[Write this page before showing it]`}));renderAll(false);toast(`Added ${want.map(x=>x[0]).join(' and ')} (hidden, with placeholders)`);return;}
  if(t.dataset.device){S.device=t.dataset.device;renderPreview();return;}
  if(t.hasAttribute('data-legend')){S.legend=!S.legend;try{localStorage.setItem('mr-sf-legend',S.legend?'1':'0');}catch(_){}$('#lg-main').classList.toggle('open',S.legend);renderState();return;}
  if(t.hasAttribute('data-checks')){S.checks=!S.checks;$('#chk-main').classList.toggle('open',S.checks);renderState();return;}
  if(t.dataset.fix){const x=checks()[+t.dataset.fix];go(x.tab);if(x.sec){S.slide[x.sec]=x.slide||0;openSection(x.sec,null);setTimeout(()=>{const a=document.querySelector('[data-bind$="imageAlt"]');a&&a.focus();},60);}else if(x.page){openPage(x.page,null);}else if(x.tab==='trust'){setTimeout(()=>$('#tr-ret')?.focus(),30);}return;}
  if(t.id==='b-publish'||t.id==='m-publish'){publish(t);return;}
  if(t.id==='b-discard'){const snap=JSON.stringify(D);D=JSON.parse(PUBLISHED);renderAll(false);toast('Changes discarded',()=>{D=JSON.parse(snap);renderAll(false);});return;}
  if(t.id==='m-preview'){openSheet('Preview','Unpublished changes included',`<div class="pv-frame" style="padding:6px"><div class="pv-screen mobile" style="width:100%;max-height:none"><div class="sf">${S.tab==='mobile'?pvMenu():S.tab==='product'||S.tab==='trust'?pvProduct():S.tab==='pages'?pvPage():pvHome()}</div></div></div>`,'',t);return;}
  if(t.id==='retry'){S.demo='loading';setDemo();renderAll(false);setTimeout(()=>{S.demo='live';setDemo();renderAll(true);toast('Loaded');},700);return;}
  if(t.dataset.demo){S.demo=t.dataset.demo;setDemo();renderAll(true);return;}
  if(t.id==='proto-min'){$('#proto').classList.toggle('min');return;}
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('[role="tab"]')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const i=TABS.findIndex(x=>x.id===S.tab)+(e.key==='ArrowRight'?1:-1);const n=TABS[(i+TABS.length)%TABS.length];go(n.id);$('#tab-'+n.id).focus();}
});
function setDemo(){document.querySelectorAll('[data-demo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.demo===S.demo));}
function go(id){S.tab=id;S.sel=null;try{history.replaceState(null,'','#'+id);}catch(_){}renderAll(true);}

/* Tooltips (hover/focus) */
let tip=null;
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;tip&&tip.remove();tip=document.createElement('div');tip.className='tip';tip.textContent=el.dataset.tip;document.body.appendChild(tip);const r=el.getBoundingClientRect();tip.style.left=Math.min(Math.max(12,r.left+r.width/2-tip.offsetWidth/2),innerWidth-tip.offsetWidth-12)+'px';tip.style.top=(r.top-tip.offsetHeight-8)+'px';});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]')&&tip){tip.remove();tip=null;}});

addEventListener('resize',()=>{moveInd();setTG();});
const h=(location.hash||'').slice(1); if(TABS.some(t=>t.id===h)) S.tab=h;
addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(x!==S.tab&&TABS.some(t=>t.id===x))go(x);});
renderDrawers(); renderAll(false);
if(innerWidth<=720) $('#proto').classList.add('min');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{moveInd();setTG();});
})();
</script>
