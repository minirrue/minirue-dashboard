<title>MiniRue Analytics · Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ink-900:#0B0B0B;--ink-800:#1A1815;--ink-700:#2E2A24;--ink-600:#3F3A32;--ink-500:#5C564C;--ink-400:#8A8376;--ink-300:#B5AE9F;
  --gold-900:#6B5526;--gold-700:#846432;--gold-500:#95783C;--gold-400:#B0924F;--gold-300:#C9B483;--gold-200:#E4D7B4;--gold-100:#EEE6D1;
  --cream-100:#FDFBF5;--cream-200:#F6F2E9;--cream-300:#EDE7D6;--cream-400:#DCD3BB;
  --bg:#F4F2EC;--surface:#FFFFFF;--sub:#F9F7F2;--hair:#E6E2D8;--row-hover:#F0EDE4;
  --ok-bg:#E5F1E6;--ok-fg:#2C5A38;--warn-bg:#FBEFCF;--warn-fg:#7A5212;--danger-bg:#FADDDE;--danger-fg:#8E1418;--muted-bg:#ECE8DE;--muted-fg:#5A5244;--info-bg:#E3EAF2;--info-fg:#2E466B;
  --c1:#A8791F;--c2:#008B77;--c3:#5B45BC;--c4:#B03A3E;
  --fg:var(--ink-900);--fg2:var(--ink-700);--fg3:var(--ink-500);--fg4:#766F63;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Jost","Futura",system-ui,sans-serif;
  --r-sm:4px;--r-md:8px;--r-lg:14px;
  --sh-sm:0 2px 4px rgba(11,11,11,.05),0 4px 10px rgba(11,11,11,.06);
  --sh-lg:0 14px 28px rgba(11,11,11,.14),0 28px 56px rgba(11,11,11,.16);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --side:216px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;accent-color:var(--ink-900)}
::selection{background:var(--gold-100);color:var(--ink-900)}
*{scrollbar-width:thin;scrollbar-color:var(--cream-400) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--cream-400);border-radius:3px}
.num,td,th,.tab-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ── Shell ─────────────────────────────── */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{background:var(--ink-900);color:var(--cream-100);padding:18px 12px;position:sticky;top:0;height:100vh;display:none;flex-direction:column;gap:18px}
.brand{font:500 17px/1 var(--label);letter-spacing:.24em;padding:6px 10px 10px;color:var(--cream-100)}
.brand span{color:var(--gold-300)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:#C9C2B3;text-decoration:none;font-weight:500}
.side a:hover{background:var(--ink-800);color:var(--cream-100)}
.side a[aria-current="page"]{background:var(--ink-800);color:var(--cream-100)}
.side a[aria-current="page"] svg{color:var(--gold-300)}
.side .foot{margin-top:auto;font-size:12px;color:#9A9385;padding:0 10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink-900);color:var(--cream-100)}
.head{padding:20px 28px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font:600 22px/1.2 var(--ui);letter-spacing:-.01em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--fg3)}
/* Animate UI: Tabs + Highlight — one indicator glides under the active tab */
.tabs{position:relative;display:none;gap:2px;padding:14px 28px 0;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:12px 12px 13px;color:var(--fg3);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab .count{margin-left:6px;font-size:12px;color:var(--fg4)}
.tab-ind{position:absolute;bottom:-1px;left:0;height:2px;background:var(--ink-900);border-radius:2px;transform-origin:left;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.tab-ind{transition:transform 240ms var(--ease),width 240ms var(--ease)}}
/* Global toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,242,236,.97);border-bottom:1px solid var(--hair);padding:10px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb-spacer{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--cream-400);background:var(--cream-100)}
.btn:active{transform:scale(.98)}
.btn[aria-expanded="true"]{border-color:var(--gold-300);background:var(--cream-100)}
.btn .val{color:var(--fg3);font-weight:400}
.btn.has .val{color:var(--fg);font-weight:600}
.btn.primary{background:var(--ink-900);border-color:var(--ink-900);color:var(--cream-100)}
.btn.primary:hover{background:var(--ink-700)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--cream-300)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;background:var(--ok-bg);color:var(--ok-fg);border:1px solid #CFE3D2;font-weight:500;white-space:nowrap}
.status-pill:hover{background:#D9EBDB}
.fresh{display:inline-flex;align-items:center;gap:6px;color:var(--fg3);white-space:nowrap}
.fresh .btn{height:40px;width:40px;padding:0;justify-content:center}
.spin svg{animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filters-mobile{display:inline-flex}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 28px 0;align-items:center}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--gold-100);color:var(--gold-900);font-weight:500;white-space:nowrap;max-width:100%}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:transparent;color:var(--gold-900)}
.chip button:hover{background:var(--gold-200)}
.chips .clear{border:0;background:none;color:var(--fg3);text-decoration:underline;text-underline-offset:3px;padding:4px 6px}
.dq{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 28px 0;color:var(--fg3);font-size:12px}
.dq span{display:inline-flex;align-items:center;gap:6px}
.dq .ok{color:var(--ok-fg)}
.dq .warn{color:var(--warn-fg)}
.dq a{color:var(--fg2);text-underline-offset:3px}
.content{padding:14px 16px 96px;display:flex;flex-direction:column;gap:16px;min-width:0;padding-bottom:150px}
@media (prefers-reduced-motion:no-preference){.content.enter{animation:enter 220ms var(--ease)}}
@keyframes enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Panels — white surface, spent by role */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.panel-h h2{margin:0;font:600 14px/1.3 var(--ui)}
.panel-h .meta{color:var(--fg3);font-size:12px}
.panel-b{padding:14px 16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* Funnel ledger — the signature: one strip, five stages, the leak named */
.ledger{display:flex;grid-template-columns:repeat(5,minmax(132px,1fr));background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);overflow:visible;overflow-x:auto;flex-direction:column}
.stage{position:relative;padding:12px 14px;border-right:0;min-width:0;display:grid;flex-direction:column;gap:4px 12px;border-bottom:1px solid var(--hair);grid-template-columns:minmax(0,1fr) auto;align-items:center}
.stage:last-child{border-right:0;border-bottom:0}
.stage-l{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--label);letter-spacing:.04em;color:var(--fg3);grid-column:1}
.stage-l button{border:0;background:none;padding:2px;color:var(--fg4);display:grid;place-items:center;border-radius:4px}
.stage-l button:hover{color:var(--fg)}
.stage-n{font:600 30px/1 var(--ui);letter-spacing:-.02em;grid-column:2;grid-row:1/span 2;font-size:26px;text-align:right}
.stage-s{color:var(--fg3);font-size:12px;min-height:17px;grid-column:1}
.stage-s b{color:var(--fg);font-weight:600}
.bar{height:4px;background:var(--cream-300);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-900);border-radius:2px;transform-origin:left}
@media (prefers-reduced-motion:no-preference){.bar i{transition:transform 320ms var(--ease)}}
.stage.leak{background:linear-gradient(90deg,var(--danger-bg),var(--danger-bg)) left/3px 100% no-repeat,var(--surface)}
.leak-tag{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:2px 8px 2px 6px;border-radius:999px;background:var(--danger-bg);color:var(--danger-fg);font-weight:600;font-size:12px}
.stage .arrow{position:absolute;right:-9px;top:17px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);display:none;place-items:center;color:var(--fg4);z-index:1}
.stage .arrow svg{width:11px;height:11px}
/* Animate UI: Sliding Number — each digit is a column that slides to its value */
.sn{display:inline-flex;overflow:hidden;height:1em;line-height:1;vertical-align:bottom}
.sn .d{display:inline-block;height:1em;overflow:hidden}
.sn .d span{display:flex;flex-direction:column}
.sn .d span b{display:block;height:1em;font-weight:inherit}
@media (prefers-reduced-motion:no-preference){.sn .d span{transition:transform 260ms var(--ease)}}
/* Tables */
.tw{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:inherit;line-height:inherit;color:inherit}
th,td{padding:7px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;z-index:2;background:var(--sub);font:500 12px/1.3 var(--label);letter-spacing:.04em;color:var(--fg3);text-transform:none;padding-top:8px;padding-bottom:8px}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.sticky-first thead th:first-child{z-index:3;background:var(--sub)}
tbody tr:hover td{background:var(--row-hover)}
tbody tr:last-child td{border-bottom:0}
th button.sort{all:unset;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:4px}
th button.sort:focus-visible{outline:2px solid var(--gold-400);outline-offset:2px}
th button.sort svg{width:12px;height:12px;opacity:.45}
th[aria-sort] button.sort svg{opacity:1;color:var(--fg)}
th[aria-sort]{color:var(--fg)}
td .cell-bar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
td .cell-bar i{display:inline-block;height:6px;border-radius:2px;background:var(--gold-300);min-width:2px}
td.zero{color:var(--ink-300)}
td.drop{color:var(--danger-fg);font-weight:600}
td.pct{color:var(--fg3)}
th.tl,td.tl{text-align:left}
#content:focus{outline:none}
.name{display:flex;align-items:center;gap:8px;min-width:0}
.name small{color:var(--fg3);font-size:12px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tag.danger{background:var(--danger-bg);color:var(--danger-fg)}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.tag.muted{background:var(--muted-bg);color:var(--muted-fg)}
.tag.info{background:var(--info-bg);color:var(--info-fg)}
.row-exp{border:0;background:none;padding:2px;margin-left:-4px;border-radius:4px;display:inline-grid;place-items:center;color:var(--fg3)}
.row-exp svg{width:14px;height:14px}
@media (prefers-reduced-motion:no-preference){.row-exp svg{transition:transform 180ms var(--ease)}}
.row-exp[aria-expanded="true"] svg{transform:rotate(90deg)}
tr.child td{background:var(--sub)}
tr.child td:first-child{padding-left:34px}
tr.clickable{cursor:pointer}
.raw{font:12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg2);background:var(--cream-200);border-radius:4px;padding:1px 6px;white-space:nowrap}
.link{color:var(--fg);text-decoration:underline;text-decoration-color:var(--cream-400);text-underline-offset:3px;background:none;border:0;padding:0}
.link:hover{text-decoration-color:var(--fg)}
/* Section toolbar (section-only controls) */
.sect-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center;flex:1 1 180px}
.search svg{position:absolute;left:9px;color:var(--fg4)}
.search input{height:32px;width:100%;max-width:100%;padding:0 10px 0 30px;border:1px solid var(--hair);border-radius:var(--r-md);background:var(--surface)}
.search input:focus{outline:2px solid var(--gold-400);outline-offset:1px}
/* Animate UI: Toggle Group — highlight slides between options */
.tg{position:relative;display:inline-flex;padding:2px;background:var(--cream-300);border-radius:var(--r-md)}
.tg button{position:relative;z-index:1;border:0;background:none;height:28px;padding:0 10px;border-radius:6px;color:var(--fg3);font-weight:500}
.tg button[aria-pressed="true"]{color:var(--fg)}
.tg .hl{position:absolute;top:2px;bottom:2px;left:0;background:var(--surface);border-radius:6px;box-shadow:0 1px 2px rgba(11,11,11,.08)}
@media (prefers-reduced-motion:no-preference){.tg .hl{transition:transform 200ms var(--ease),width 200ms var(--ease)}}
/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:12px var(--ui);fill:var(--fg4)}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .area{fill:var(--gold-100)}
.chart .line{fill:none;stroke:var(--gold-700);stroke-width:1.75}
.chart .end{fill:var(--gold-700);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent}
.chart .cursor{stroke:var(--ink-400);stroke-dasharray:2 3}
.split{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* Lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.li:last-child{border-bottom:0}
.li .t{justify-self:start;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{grid-column:1/-1;color:var(--fg3);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.defs{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:8px 16px;margin:0}
.defs dt{font-weight:600}
.defs dd{margin:0;color:var(--fg2)}
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--hair)}
.check:last-child{border-bottom:0}
.check .ok{color:var(--ok-fg)}
.check .warn{color:var(--warn-fg)}
.check .bad{color:var(--danger-fg)}
.check p{margin:2px 0 0;color:var(--fg3)}
.recon{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden}
.recon div{padding:12px 14px;border-right:0;border-bottom:1px solid var(--hair)}
.recon div:last-child{border-right:0;border-bottom:0}
.recon b{display:block;font:600 22px/1.1 var(--ui)}
.recon span{color:var(--fg3);font-size:12px}
.recon s{color:var(--ink-400);text-decoration-thickness:1px}
/* Journey flow */
.journey{display:flex;flex-direction:column;gap:18px}
.sess h3{margin:0 0 8px;font:600 13px/1.3 var(--ui);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sess h3 span{color:var(--fg3);font-weight:400}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.step{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--hair);border-radius:var(--r-md);background:var(--surface);min-width:0;max-width:220px}
.step time{font-size:12px;color:var(--fg3)}
.step b{font-weight:600;font-size:12.5px}
.step small{color:var(--fg3)}
.step.key{border-color:var(--gold-300);background:var(--cream-100)}
.step.exit{background:var(--sub)}
.steps .to{display:grid;place-items:center;color:var(--ink-300)}
/* Page-type pills (kp) and platform pills (sp) */
.kp,.sp{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.kp svg,.sp svg{width:12px;height:12px}
.sp{padding-left:8px}
.kp-home{background:#F3EBD9;color:#6B5526}
.kp-category{background:#DDF1EC;color:#00614F}
.kp-product{background:#E8E3F7;color:#46329E}
.kp-bag{background:#F8E6D9;color:#8A4216}
.kp-checkout{background:#FADDDE;color:#8E1418}
.kp-unknown{background:#FBEFCF;color:#7A5212}
.kp-action{background:#ECE8DE;color:#5A5244}
.kp-exit{background:#ECE8DE;color:#5A5244}
.sp-tiktok{background:#0B0B0B;color:#FDFBF5}
.sp-instagram{background:#F5E1EF;color:#7A2A69}
.sp-facebook{background:#DDEBF4;color:#0A5A82}
.sp-meta{background:#E3E1F7;color:#3F2F96}
.sp-direct{background:#ECE8DE;color:#3F3A32}
.sp-referral{background:#F8E6D9;color:#8A4216}
.step-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step-src{margin-top:2px}
.step.k-product{border-color:#CFC6EE}
.step.k-bag,.step.key.k-bag{border-color:#EBC7AC;background:#FDF6F0}
.step.k-checkout{border-color:#F0B9BB;background:#FFF7F7}
.step.k-unknown{border-color:#EFD9A0}
.sess h3 .sp{font-size:12px}
.journey.v .steps{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
.journey.v .step{max-width:none}
.journey.v .to{height:14px}
.journey.v .to svg{transform:rotate(90deg)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.jl{display:flex;flex-direction:row;padding:6px;max-height:none;overflow:auto;overflow-x:auto}
.jp{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r-md);flex:none;min-width:200px;min-height:44px}
.jp:hover{background:var(--cream-200)}
.jp[aria-current="true"]{background:var(--cream-100);box-shadow:inset 0 0 0 1px var(--gold-300)}
.jp small{color:var(--fg3);padding-left:16px}
/* Legend */
.lg-toggle{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:2px 8px 2px 7px;color:var(--fg2);font-weight:500;font-size:12px}
.lg-toggle:hover{border-color:var(--cream-400);color:var(--fg)}
.lg-toggle svg:last-child{width:12px;height:12px}
@media (prefers-reduced-motion:no-preference){.lg-toggle svg:last-child{transition:transform 180ms var(--ease)}}

function sn(key,val){

}

function ledger(t){
  const st = [
    {k:'v',l:'Visited',d:'visitors',n:t.v},
    {k:'p',l:'Viewed a product',d:'viewed',n:t.p,prev:t.v},
    {k:'b',l:'Added to bag',d:'bag',n:t.b,prev:t.p},
    {k:'c',l:'Reached checkout',d:'checkout',n:t.c,prev:t.b},
    {k:'o',l:'Purchased',d:'purchased',n:t.o,prev:t.c},
  ];
  // biggest drop = largest absolute people lost between stages
  let leak=-1,max=0; st.forEach((s,i)=>{ if(i>0){const lost=st[i-1].n-s.n; if(lost>max){max=lost;leak=i;} }});
  return `<section class="ledger" aria-label="Funnel, unique visitors">${st.map((s,i)=>{
    const isLeak = i===leak && s.prev;
    const lost = s.prev!=null ? s.prev - s.n : 0;
    return `<div class="stage${isLeak?' leak':''}">
      <div class="stage-l">${s.l}<button data-tip="${s.d}" aria-label="What counts as ${s.l}">${icon('info','i sm')}</button></div>
      <div class="stage-n">${sn('led-'+s.k,s.n)}</div>
      <div class="stage-s">${s.prev!=null?`<b>${pctS(s.n,s.prev)}</b> of previous step`:'unique people · 30 days'}</div>
      <div class="bar" aria-hidden="true"><i style="transform:scaleX(${t.v?s.n/t.v:0})"></i></div>
      ${isLeak?`<span class="leak-tag">${icon('alert','i sm')}Biggest drop · −${fmt(lost)}</span>`:''}
      ${i<4?`<span class="arrow" aria-hidden="true">${icon('right','i')}</span>`:''}
    </div>`;}).join('')}</section>`;
}

function trendSVG(scale){
  const data = DAILY.map(v=>Math.round(v*scale*10)/10);
  const W=560,H=170,pl=28,pr=12,pt=12,pb=24; const max=Math.max(12,Math.ceil(Math.max(...data)/4)*4);
  const x=i=>pl+i*(W-pl-pr)/(data.length-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=data.map((v,i)=>[x(i),y(v)]);
  const line='M'+pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join('L');
  const area=line+`L${x(data.length-1)} ${H-pb}L${pl} ${H-pb}Z`;
  const ticks=[0,max/2,max];
  const days=i=>{const d=new Date(2026,7,23+i);return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];};
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Unique visitors per day, 23 Aug to 21 Sep. Peak 11 on 5 Sep.">
    ${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    ${[0,7,14,21,29].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===29?'end':'middle'}">${days(i)}</text>`).join('')}
    <line class="cursor" id="cur" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>
    <circle class="end" cx="${last[0]}" cy="${last[1]}" r="4"/>
    ${pts.map((p,i)=>`<rect class="hit" x="${p[0]-(W-pl-pr)/(data.length-1)/2}" y="${pt}" width="${(W-pl-pr)/(data.length-1)}" height="${H-pt-pb}" data-tipx="${days(i)}: <b>${data[i]}</b> visitors" data-cx="${p[0]}"/>`).join('')}
  </svg>`;
}

/* Colour-coded pills: page type for every step, platform for every source */
const PAGE_KIND = {
  home:{l:'Home',ic:'store'}, category:{l:'Category',ic:'filter'}, product:{l:'Product',ic:'pkg'},
  bag:{l:'Bag',ic:'bag'}, checkout:{l:'Checkout',ic:'receipt'}, unknown:{l:'Unknown path',ic:'alert'},
  action:{l:'Action',ic:'check'}, exit:{l:'Left',ic:'x'}
};
function stepKind(t,cls){
  if(cls==='exit') return 'exit';
  if(/unknown path/i.test(t)) return 'unknown';
  if(/checkout|delivery step/i.test(t)) return 'checkout';
  if(/bag/i.test(t)) return 'bag';
  if(/Arencia|Vita A|product/i.test(t)) return 'product';
  if(/skincare|category/i.test(t)) return 'category';
  if(/Home/.test(t)) return 'home';
  return 'action';
}
function platform(src){
  if(/TikTok/i.test(src)) return 'tiktok';
  if(/Instagram/i.test(src)) return 'instagram';
  if(/Facebook/i.test(src)) return 'facebook';
  if(/Meta/i.test(src)) return 'meta';
  if(/Direct/i.test(src)) return 'direct';
  return 'referral';
}
const srcPill = src => `<span class="sp sp-${platform(src)}">${src}${/missing|unnamed/.test(src)?` ${icon('alert','i sm')}`:''}</span>`;
const kindPill = k => `<span class="kp kp-${k}">${icon(PAGE_KIND[k].ic,'i sm')}${PAGE_KIND[k].l}</span>`;

  const r=el.getBoundingClientRect(); const w=tip.offsetWidth,h=tip.offsetHeight;
  let left=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12); let top=r.top-h-8; if(top<8) top=r.bottom+8;
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function hideTip(){if(tip){tip.remove();tip=null;}}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]'); if(el&&e.pointerType==='mouse') showTip(el,DEFS[el.dataset.tip]);
  const h=e.target.closest('[data-tipx]'); if(h){showTip(h,h.dataset.tipx); const c=$('#cur'); if(c){c.setAttribute('x1',h.dataset.cx);c.setAttribute('x2',h.dataset.cx);c.setAttribute('visibility','visible');}}});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip],[data-tipx]')){hideTip(); const c=$('#cur'); c&&c.setAttribute('visibility','hidden');}});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]'); if(el) showTip(el,DEFS[el.dataset.tip]);});
document.addEventListener('focusout',hideTip);
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-tip]'); if(el&&e.pointerType!=='mouse'){showTip(el,DEFS[el.dataset.tip]); setTimeout(hideTip,2600);}});

/* Sheets */
let sheetState=null;
function openSheet(title,sub,body,foot,trig){
  closeSheet(true);
  const scrim=document.createElement('div'); scrim.className='scrim';
  const sh=document.createElement('div'); sh.className='sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.setAttribute('aria-labelledby','sheet-t');
  sh.innerHTML=`<div class="sheet-h"><div><h2 id="sheet-t">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}`;
  document.body.append(scrim,sh); sheetState={scrim,sh,trig};
  scrim.addEventListener('click',()=>closeSheet());
  sh.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});
  sh.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();closeSheet();}
    if(e.key==='Tab'){const f=[...sh.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null); const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
  });
  document.body.style.overflow='hidden';
  setTimeout(()=>{(sh.querySelector('[data-autofocus]')||sh.querySelector('.sheet-b input,.sheet-b button')||sh.querySelector('[data-close]')).focus();},30);
  return sh;
}
function closeSheet(instant){
  if(!sheetState) return; const {scrim,sh,trig}=sheetState; sheetState=null; document.body.style.overflow='';
  if(instant||reduce.matches){scrim.remove();sh.remove();}
  else {sh.classList.add('out');scrim.classList.add('out');setTimeout(()=>{scrim.remove();sh.remove();},190);}
  if(trig&&document.contains(trig)) trig.focus();
}

function filterContext(){
  const parts=[]; FILTERS.forEach(f=>S.f[f.k].forEach(v=>parts.push(`${f.l}: ${f.opts.find(o=>o.v===v).l}`)));
  return parts.length?parts.join(' · '):'None';
}
function openExport(trig){
  const cur=SECTIONS.find(s=>s.id===S.section).l;
  const body=`
    <fieldset><legend>What to export</legend>
      <label class="choice"><input type="radio" name="scope" id="sc-cur" value="current" checked><span><b>This section · ${cur}</b><small>Exactly what you see, every table row included</small></span></label>
      <label class="choice"><input type="radio" name="scope" id="sc-sel" value="selected"><span><b>Selected sections</b><small>Pick the sections to include</small></span></label>
      <div class="ah" id="sel-ah"><div><div class="sub-list" id="sub-list" aria-disabled="true">${SECTIONS.map(s=>`<label><input type="checkbox" id="exs-${s.id}" value="${s.id}"${s.id===S.section?' checked':''}>${s.l}</label>`).join('')}</div></div></div>
      <label class="choice"><input type="radio" name="scope" id="sc-all" value="all"><span><b>Entire dashboard</b><small>All seven sections, in order</small></span></label>
    </fieldset>
    <fieldset><legend>Format</legend>
      <div class="tg" role="group" aria-label="File format" id="fmt"><span class="hl"></span><button type="button" aria-pressed="true" data-fmt="CSV">CSV</button><button type="button" aria-pressed="false" data-fmt="JSON">JSON</button></div>
    </fieldset>
    <dl class="preview" aria-label="Export includes">
      <div><dt>Date range</dt><dd>23 Aug – 21 Sep 2026</dd></div>
      <div><dt>Filters</dt><dd>${filterContext()}</dd></div>
      <div><dt>Who counts</dt><dd>Excluding this device + signed-in staff (since 12 Sep 2026) + bots</dd></div>
      <div><dt>Sections</dt><dd id="pv-sec">${cur}</dd></div>
      <div><dt>Generated</dt><dd id="pv-ts">at export time, e.g. 22 Sep 2026, 1:45 PM (Cairo)</dd></div>
      <div><dt>File</dt><dd id="pv-file" class="raw" style="white-space:normal">minirue-analytics_${S.section}_2026-08-23_2026-09-21.csv</dd></div>
    </dl>
    <div><button class="disclose" aria-expanded="false" aria-controls="adv" id="adv-t">${icon('right')}Advanced</button>
      <div class="ah" id="adv"><div><label class="choice" style="margin-top:6px"><input type="checkbox" id="raw-ev"><span><b>Raw events (event-level)</b><small>Every tracked event with its event ID, one row each. Large. Separate file, not a copy of the dashboard.</small></span></label></div></div></div>
    <div id="ex-status" role="status" aria-live="polite"></div>`;
  const foot=`<button class="btn" data-close>Cancel</button><button class="btn primary" id="ex-go" data-autofocus>${icon('dl','i sm')}Export</button>`;
  const sh=openSheet('Export','Matches what’s on screen, with the same filters.',body,foot,trig);
  let fmtV='CSV';
  const upd=()=>{
    const sc=sh.querySelector('input[name="scope"]:checked').value;
    sh.querySelector('#sub-list').setAttribute('aria-disabled',sc!=='selected');
    sh.querySelector('#sel-ah').classList.toggle('open',sc==='selected');
    const secs=sc==='current'?[cur]:sc==='all'?SECTIONS.map(s=>s.l):SECTIONS.filter(s=>sh.querySelector('#exs-'+s.id).checked).map(s=>s.l);
    sh.querySelector('#pv-sec').textContent=secs.length?secs.join(', '):'None selected: tick at least one';
    const slug=sc==='current'?S.section:sc==='all'?'dashboard':'sections';
    const multi=sc!=='current'&&fmtV==='CSV';
    sh.querySelector('#pv-file').textContent=`minirue-analytics_${slug}_2026-08-23_2026-09-21.${multi?'zip (one CSV per section)':fmtV.toLowerCase()}`;
    sh.querySelector('#ex-go').disabled=!secs.length;
  };
  sh.addEventListener('change',upd);
  sh.querySelector('#fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fmtV=b.dataset.fmt;sh.querySelectorAll('#fmt button').forEach(x=>x.setAttribute('aria-pressed',x===b));setTG();upd();});
  sh.querySelector('#adv-t').addEventListener('click',e=>{const b=e.currentTarget;const o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);sh.querySelector('#adv').classList.toggle('open',o);});
  sh.querySelector('#ex-go').addEventListener('click',()=>{
    const st=sh.querySelector('#ex-status'); const go=sh.querySelector('#ex-go'); go.disabled=true;
    st.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><span>Building your export…</span><div class="progress"><i></i></div></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{st.querySelector('.progress i').style.transform='scaleX(1)';}));
    setTimeout(()=>{
      sh.querySelector('#pv-ts').textContent='22 Sep 2026, 1:45 PM (Cairo time)';
      st.innerHTML=`<div class="ready">${icon('ok')}<div><b>Export ready</b><p>${sh.querySelector('#pv-file').textContent}${sh.querySelector('#raw-ev').checked?' + raw events file':''}. Prototype: no file is created.</p></div></div>`;
      go.disabled=false; go.innerHTML=icon('check','i sm')+'Done'; go.onclick=()=>{closeSheet();toast('Export ready');};
    },reduce.matches?300:1500);
  });
  setTimeout(setTG,40);
}
function openSettings(trig){
  const modes=[

    ['staff','This device + signed-in staff','Also leaves out anyone signed in to the dashboard.',true],
    ['test','Test users','Accounts tagged “Ours / test” on their customer page.'],

  ];
  const body=`
    <div class="note">${icon('info')}<span>Changes apply to every section and every export. History is re-checked on the next hourly rollup, so past days fix themselves too.</span></div>
    <fieldset><legend>Who to leave out</legend>
      ${modes.map(m=>`<label class="choice"><input type="radio" name="mode" id="m-${m[0]}" value="${m[0]}"${m[3]?' checked':''}><span><b>${m[1]}</b><small>${m[2]}</small></span></label>`).join('')}

function openFilterSheet(){
  const body=FILTERS.map(f=>`<fieldset><legend>${f.l}</legend>${f.opts.map(o=>`<label class="choice" style="grid-template-columns:18px 1fr"><input type="checkbox" data-fk="${f.k}" value="${o.v}" id="fs-${f.k}-${o.v}"${S.f[f.k].includes(o.v)?' checked':''}><span><b>${o.l}</b></span></label>`).join('')}</fieldset>`).join('');
  const sh=openSheet('Filters','Apply to every section',body,`<button class="btn" id="fs-clear">Clear all</button><button class="btn primary" id="fs-apply">Show results</button>`,$('#b-filters'));
  sh.querySelector('#fs-clear').addEventListener('click',()=>sh.querySelectorAll('input').forEach(i=>i.checked=false));
  sh.querySelector('#fs-apply').addEventListener('click',()=>{FILTERS.forEach(f=>S.f[f.k]=[...sh.querySelectorAll(`input[data-fk="${f.k}"]:checked`)].map(i=>i.value));syncDemo();closeSheet();renderAll(true);toast(`${sum(rows()).v} visitors match`);});
}
function openVisitor(id,trig){
  const p=PEOPLE.find(x=>x.id===id)||PEOPLE[0]; const v=visitorSummary(p);
  const body=`<div style="display:flex;flex-direction:column;gap:8px"><span style="color:var(--fg3)">${v.meta}</span><div style="display:flex;gap:6px;flex-wrap:wrap">${v.tags}</div></div><div class="mini-lg"><button class="disclose" data-mini-legend aria-expanded="false">${icon('right')}What the pills mean</button><div class="ah"><div>${legendHTML(['pages','sources','status'])}</div></div></div>${journeyHTML(p.id,true)}`;
  openSheet(`Visitor #${p.id}`,`${p.src} · ${p.city} · ${p.dev}`,body,`<button class="btn" data-close>Close</button><button class="btn primary" data-go="journeys" data-jid="${p.id}" data-close>Open in Journeys</button>`,trig);
}
function openPath(i,trig){
  const r=ROWS[i]; const lost=r.p-r.b;
  const ppl=PEOPLE.filter(p=>p.src===CAMP[r.cp].l).slice(0,4);
  const body=`<dl class="preview"><div><dt>Path</dt><dd>${CAMP[r.cp].l} → ${LAND[r.ld]}</dd></div><div><dt>People</dt><dd>${r.v} visited · ${r.p} viewed a product · ${r.b} added · ${r.c} checkout · ${r.o} bought</dd></div><div><dt>Biggest loss</dt><dd>${r.v-r.p>=lost?`${r.v-r.p} left before viewing a product`:`${lost} viewed but didn’t add`}</dd></div></dl>
    <div><legend style="display:block">People on this path</legend><div class="list">${ppl.length?ppl.map(p=>`<div class="li"><button class="link t" data-visitor="${p.id}">Visitor #${p.id}</button><span>${p.last}</span><div class="s"><span>${p.city} · ${p.dev}</span><span>· ${p.out}</span></div></div>`).join(''):'<p style="margin:0;color:var(--fg3)">Sample rows not available for this path.</p>'}</div></div>`;
  openSheet('Path detail',`${r.v} people`,body,`<button class="btn" data-close>Close</button>`,trig);
}

/* Boot */
const h=(location.hash||'').slice(1); if(SECTIONS.some(s=>s.id===h)) S.section=h;
renderTabs(); renderBnav(); renderLegend(); renderAll(false);
if(innerWidth<=720) $('#proto').classList.add('min');
addEventListener('hashchange',()=>{const x=location.hash.slice(1); if(x!==S.section&&SECTIONS.some(s=>s.id===x)) go(x);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{moveInd();setTG();});
})();
